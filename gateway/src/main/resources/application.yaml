spring:
  application:
    name: gateway
  profiles:
    active: dev
  config:
    import: nacos:common-dev.yaml?namespace=public&group=DEFAULT_GROUP
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        dashboard: 127.0.0.1:8090
        port: 8719
      filter:
        enabled: true
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: lb://user-service
              predicates:
                       - Path=/user/**
            - id: order-service-route
              uri: lb://order-service
              predicates:
                       - Path=/order/**

server:
  port: 8080
